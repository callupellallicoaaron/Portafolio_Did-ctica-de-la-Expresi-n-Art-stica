<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reproductor de Video - Instrumentos Musicales</title>
    <!-- Cargamos Tailwind CSS para los estilos -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Estilos adicionales opcionales para personalizar el reproductor si es necesario */
        video {
            outline: none;
        }
    </style>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4 font-sans selection:bg-indigo-500 selection:text-white">

    <!-- Contenedor principal centrado -->
    <div class="bg-slate-800 p-6 md:p-10 rounded-3xl shadow-2xl border border-slate-700 w-full max-w-5xl flex flex-col items-center transform transition-all hover:scale-[1.01] duration-300">
        
        <!-- Título -->
        <h1 class="text-3xl md:text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-cyan-400 mb-8 text-center tracking-tight">
            Construccion de Instrumentos Musicales
        </h1>

        <!-- Enlace simulando el reproductor -->
        <a href="https://youtu.be/sL2cbkPLk64" target="_blank" rel="noopener noreferrer" class="relative w-full aspect-video rounded-2xl overflow-hidden shadow-black/50 shadow-lg bg-black block group cursor-pointer">
            
            <!-- Miniatura de YouTube -->
            <img src="https://img.youtube.com/vi/sL2cbkPLk64/hqdefault.jpg" alt="Miniatura de Instrumentos Musicales" class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-105">
            
            <!-- Botón de Play sobrepuesto -->
            <div class="absolute inset-0 flex items-center justify-center bg-black/30 group-hover:bg-black/50 transition-all duration-300">
                <div class="w-20 h-20 flex items-center justify-center bg-white/80 rounded-full shadow-lg backdrop-blur-sm group-hover:bg-white transition-all group-hover:scale-110">
                    <svg class="w-10 h-10 text-slate-900 ml-2" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M8 5v14l11-7z" />
                    </svg>
                </div>
            </div>
        </a>
        
        <!-- Pie de página o información adicional -->
        <p class="text-slate-400 mt-6 text-sm text-center">
            Haz clic en la imagen para abrir y ver el video en <span class="text-red-400 font-semibold">YouTube</span>.
        </p>

    </div>

</body>
</html>
